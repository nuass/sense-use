[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sense-use"
version = "0.1.0"
description = "Open-source, self-hosted Computer + Mobile + Browser Use — one TUI, floating live viewers, voice-in, all local."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "senseone", email = "hello@senseone.cc" }]
keywords = ["agent", "computer-use", "mobile-use", "browser-use", "textual", "playwright", "adb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "textual>=0.60",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "httpx>=0.27",
    "websockets>=12",
    "pyyaml>=6",
    "playwright>=1.44",
    "pillow>=10",
]

[project.optional-dependencies]
mobile = ["mobile-use-agent"]
desktop = ["pyautogui>=0.9.54"]
vnc = ["vncdotool>=1.2"]
voice = ["sounddevice>=0.4.6", "numpy>=1.26"]
viewer = ["PyQt6>=6.6"]
all = [
    "mobile-use-agent",
    "pyautogui>=0.9.54",
    "vncdotool>=1.2",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "PyQt6>=6.6",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
sense-use = "sense_use.cli:app"

[project.urls]
Homepage = "https://github.com/nuass/sense-use"
Repository = "https://github.com/nuass/sense-use"
Issues = "https://github.com/nuass/sense-use/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sense_use*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
